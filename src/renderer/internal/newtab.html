<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New Tab</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; padding-top: 16vh;
      background: #202124; color: #e8eaed;
      font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-weight: 500; font-size: 34px; letter-spacing: -0.5px; margin: 0 0 28px; }
    h1 span { color: #8ab4f8; }
    form { width: min(560px, 90vw); position: relative; }
    input {
      width: 100%; height: 48px; border-radius: 24px; border: 1px solid #3c4043;
      background: #292a2d; color: #e8eaed; font-size: 16px; padding: 0 20px; outline: 0;
    }
    input:focus { border-color: #8ab4f8; background: #202124; }
    .grid {
      margin-top: 40px; width: min(560px, 90vw);
      display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px;
    }
    a.tile {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 8px; border-radius: 12px; text-decoration: none; color: #e8eaed;
      background: #292a2d;
    }
    a.tile:hover { background: #35363a; }
    a.tile .ico {
      width: 28px; height: 28px; border-radius: 50%; background: #3c4043;
      background-size: 18px; background-repeat: no-repeat; background-position: center;
    }
    a.tile span { font-size: 12px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .section { color: #9aa0a6; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 36px 0 -8px; width: min(560px,90vw); }
  </style>
</head>
<body>
  <h1>Truth<span>ful</span></h1>
  <form id="f">
    <input id="q" autofocus autocomplete="off" placeholder="Search or type a URL" />
  </form>
  <div class="section" id="bm-label" style="display:none">Bookmarks</div>
  <div class="grid" id="bm"></div>

  <script>
    let engine = 'https://www.google.com/search?q=%s';

    function go(text) {
      const s = text.trim();
      if (!s) return;
      let url;
      if (/^(https?|file|browser|about):/i.test(s)) url = s;
      else if (/^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i.test(s) && !/\s/.test(s)) url = 'https://' + s;
      else if (/^localhost(:\d+)?/i.test(s)) url = 'http://' + s;
      else url = engine.replace('%s', encodeURIComponent(s));
      location.href = url;
    }

    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      go(document.getElementById('q').value);
    });

    function faviconFor(u) {
      try { return new URL(u).origin + '/favicon.ico'; } catch { return ''; }
    }

    fetch('browser://api/newtab')
      .then((r) => r.json())
      .then((d) => {
        if (d.settings && d.settings.searchEngine) engine = d.settings.searchEngine;
        const q = document.getElementById('q');
        q.placeholder = 'Search ' + ((d.settings && d.settings.searchEngineName) || 'the web') + ' or type a URL';

        const grid = document.getElementById('bm');
        const items = (d.bookmarks && d.bookmarks.length ? d.bookmarks : d.history) || [];
        if (items.length) {
          document.getElementById('bm-label').style.display = 'block';
          document.getElementById('bm-label').textContent = d.bookmarks && d.bookmarks.length ? 'Bookmarks' : 'Recent';
        }
        for (const b of items.slice(0, 12)) {
          const a = document.createElement('a');
          a.className = 'tile';
          a.href = b.url;
          const ico = document.createElement('div');
          ico.className = 'ico';
          const fav = faviconFor(b.url);
          if (fav) ico.style.backgroundImage = `url("${fav}")`;
          const label = document.createElement('span');
          label.textContent = b.title || b.url;
          a.append(ico, label);
          grid.append(a);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
